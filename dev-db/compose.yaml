  postgres:
    image: postgres:16
    container_name: postgres
    networks:
      - dev-db
    restart: no
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mssql:
    # docker exec -it postgres psql -U sa -l
    # docker cp "../T-SQL/pgCreate.sql" postgres:/tmp/pgCreate.sql
    # docker exec -it postgres psql -U sa -d db -f /tmp/pgCreate.sql
    # docker exec -it postgres psql -U sa -d db -c "\dt jiajunleeWeb.*"
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    networks:
      - dev-db
    restart: no
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_DB: "${DB_DATABASE}"
      SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - ./mssql_data:/var/opt/mssql 

